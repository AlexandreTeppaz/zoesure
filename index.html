<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ZF319 Control</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background: #ffffff; color: #111111; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
    .box { border: 1px solid #e5e5e5; border-radius: 8px; padding: 14px; background: #ffffff; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .header-title { font-size: 1.05rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
    .panel-row:last-child { border-bottom: none; padding-bottom: 0; }
    .panel-row:first-child { padding-top: 0; }
    .panel-name { font-size: 0.92rem; font-weight: 600; border: 1px solid transparent; border-radius: 4px; padding: 2px 4px; margin-left: -4px; color: #111111; background: transparent; width: 150px; }
    .panel-name:focus { outline: none; border-color: #d4d4d4; background: #fafafa; }
    .sub { font-size: 0.76rem; color: #666666; margin-top: 2px; }
    .sub.connected { color: #111111; font-weight: 500; }
    button {
      border: 1px solid #d4d4d4;
      background: #ffffff;
      color: #111111;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { background: #f5f5f5; }
    button.selected { background: #111111; color: #ffffff; border-color: #111111; }
    button.icon-btn { padding: 6px 10px; font-weight: 600; }
    button.del-btn { padding: 8px 10px; color: #888888; border-color: #e5e5e5; }
    .target-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .target-grid button { flex: 1 1 auto; min-width: 80px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
    .swatch { aspect-ratio: 1; border-radius: 4px; border: 1px solid #d4d4d4; cursor: pointer; }
    input[type="color"] { width: 100%; height: 40px; border: 1px solid #d4d4d4; border-radius: 6px; padding: 2px; background: #ffffff; cursor: pointer; }
    input[type="range"] { width: 100%; accent-color: #111111; margin-top: 8px; }
    label { font-size: 0.82rem; color: #555555; display: flex; justify-content: space-between; }

    /* Modale 3 pages */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      width: 100%; max-width: 380px; background: #ffffff; border: 1px solid #e5e5e5;
      border-radius: 8px; padding: 20px; display: flex; flex-direction: column; gap: 16px;
    }
    .modal-step { font-size: 0.75rem; color: #777777; text-transform: uppercase; letter-spacing: 0.04em; }
    .modal-title { font-size: 1rem; font-weight: 600; margin: 4px 0 0 0; }
    .modal-text { font-size: 0.88rem; line-height: 1.5; color: #333333; margin: 0; }
    .modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .dots { display: flex; gap: 6px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #d4d4d4; }
    .dot.active { background: #111111; }
  </style>
</head>
<body>

  <!-- Modale 3 étapes -->
  <div id="infoModal" class="modal-overlay">
    <div class="modal-box">
      <div>
        <div id="modalStep" class="modal-step">Étape 1 / 3</div>
        <h2 id="modalTitle" class="modal-title">Sécurité Bluetooth</h2>
      </div>
      <p id="modalBody" class="modal-text"></p>
      <div class="modal-footer">
      <div class="dots">
          <span class="dot active" id="dot0"></span>
          <span class="dot" id="dot1"></span>
          <span class="dot" id="dot2"></span>
          <span class="dot" id="dot3"></span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="modalPrev" style="display: none;">Précédent</button>
          <button id="modalNext" class="selected">Suivant</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <!-- En-tête + bouton [+] -->
    <div class="row">
      <h1 class="header-title">ZOESURE ZF319</h1>
      <div style="display: flex; gap: 6px;">
        <button id="btnHelp" class="icon-btn" title="Informations">?</button>
        <button id="btnAddPanel" class="icon-btn" title="Ajouter un panneau">[+]</button>
      </div>
    </div>

    <!-- Liste dynamique des panneaux -->
    <div class="box" id="panelsList"></div>

    <!-- Cible du contrôle -->
    <div class="box">
      <label style="margin-bottom: 8px;"><span>Cible du contrôle</span></label>
      <div class="target-grid" id="targetGrid"></div>
    </div>

    <!-- Alimentation -->
    <div class="box grid-2">
      <button id="btnOn">Allumer</button>
      <button id="btnOff">Éteindre</button>
    </div>

    <!-- Couleur -->
    <div class="box">
      <label><span>Couleur</span><span id="hexLabel">#FF4500</span></label>
      <input type="color" id="colorPicker" value="#ff4500" style="margin-top: 8px;" />
      <div class="swatches" id="swatches"></div>
    </div>

    <!-- Luminosité & Blanc -->
    <div class="box">
      <label><span>Luminosité</span><span id="brightVal">100%</span></label>
      <input type="range" id="brightness" min="1" max="100" value="100" />
      <label style="margin-top: 14px;"><span>Blanc Chaud / Froid</span><span id="cctVal">50%</span></label>
      <input type="range" id="cct" min="0" max="100" value="50" />
    </div>

    <!-- Animations -->
    <div class="box">
      <label style="margin-bottom: 8px;"><span>Animations</span><span id="animLabel">Off</span></label>
      <div class="grid-3">
        <button data-anim="rainbow">Arc-en-ciel</button>
        <button data-anim="pulse">Respiration</button>
        <button data-anim="police">Gyrophare</button>
      </div>
      <label style="margin-top: 14px;"><span>Vitesse</span><span id="speedVal">Moyenne</span></label>
      <input type="range" id="speed" min="80" max="500" value="180" />
    </div>
  </div>

  <script>
    const SERVICE_UUID = 0x0929;
    const CHAR_UUID = 0x1224;
    const PROFILES = [
      { service: 0x0929, char: 0x1224 },
      { service: 0xFFE0, char: 0xFFE1 }
    ];
    const STORAGE_KEY = 'zf319_panels_v1';
    // Chargement de la configuration sauvegardée (1 panneau par défaut)
    let savedPanels = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!Array.isArray(savedPanels) || savedPanels.length === 0) {
      savedPanels = [{ id: 1, name: 'Panneau 1' }];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedPanels));
    }

    // État Bluetooth en mémoire (non persistant au reload)
    const bleState = {};
    savedPanels.forEach(p => {
      bleState[p.id] = { char: null, writing: false, device: null, statusText: 'Non connecté', connected: false };
    });

    let target = 'all';
    let animTimer = null;
    let currentAnim = null;
    let currentRGB = [255, 69, 0];

    function savePanels() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedPanels));
    }

    function renderUI() {
      const listEl = document.getElementById('panelsList');
      const targetEl = document.getElementById('targetGrid');
      listEl.innerHTML = '';
      targetEl.innerHTML = '';

      savedPanels.forEach(panel => {
        const st = bleState[panel.id] || { char: null, writing: false, device: null, statusText: 'Non connecté', connected: false };
        bleState[panel.id] = st;

        // Ligne dans la liste des panneaux
        const row = document.createElement('div');
        row.className = 'panel-row';

        const left = document.createElement('div');
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.className = 'panel-name';
        nameInput.value = panel.name;
        nameInput.title = 'Cliquer pour renommer';
        nameInput.onchange = (e) => {
          const val = e.target.value.trim() || `Panneau ${panel.id}`;
          panel.name = val;
          e.target.value = val;
          savePanels();
          renderTargetsOnly();
        };

        const sub = document.createElement('div');
        sub.className = 'sub' + (st.connected ? ' connected' : '');
        sub.id = `status-${panel.id}`;
        sub.textContent = st.statusText;

        left.appendChild(nameInput);
        left.appendChild(sub);

        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '6px';

        const connBtn = document.createElement('button');
        connBtn.textContent = st.connected ? 'Reconnecter' : 'Connecter';
        connBtn.onclick = () => connectPanel(panel.id);
        actions.appendChild(connBtn);

        if (savedPanels.length > 1) {
          const delBtn = document.createElement('button');
          delBtn.className = 'del-btn';
          delBtn.textContent = '×';
          delBtn.title = 'Supprimer ce panneau';
          delBtn.onclick = () => removePanel(panel.id);
          actions.appendChild(delBtn);
        }

        row.appendChild(left);
        row.appendChild(actions);
        listEl.appendChild(row);
      });

      renderTargetsOnly();
    }

    function renderTargetsOnly() {
      const targetEl = document.getElementById('targetGrid');
      targetEl.innerHTML = '';

      // Bouton "Tous" en premier et sélectionné par défaut
      const allBtn = document.createElement('button');
      allBtn.textContent = 'Tous';
      if (target === 'all') allBtn.classList.add('selected');
      allBtn.onclick = () => { target = 'all'; renderTargetsOnly(); };
      targetEl.appendChild(allBtn);

      savedPanels.forEach(panel => {
        const btn = document.createElement('button');
        btn.textContent = panel.name;
        if (String(target) === String(panel.id)) btn.classList.add('selected');
        btn.onclick = () => { target = panel.id; renderTargetsOnly(); };
        targetEl.appendChild(btn);
      });
    }

    // Ajouter un panneau N+1
    document.getElementById('btnAddPanel').onclick = () => {
      const maxId = savedPanels.reduce((max, p) => Math.max(max, p.id), 0);
      const nextId = maxId + 1;
      savedPanels.push({ id: nextId, name: `Panneau ${nextId}` });
      bleState[nextId] = { char: null, writing: false, device: null, statusText: 'Non connecté', connected: false };
      savePanels();
      renderUI();
    };

    function removePanel(id) {
      if (bleState[id]?.device?.gatt?.connected) {
        bleState[id].device.gatt.disconnect();
      }
      delete bleState[id];
      savedPanels = savedPanels.filter(p => p.id !== id);
      if (String(target) === String(id)) target = 'all';
      savePanels();
      renderUI();
    }

    async function connectPanel(id) {
      const st = bleState[id];
      const subEl = document.getElementById(`status-${id}`);
      try {
        st.statusText = 'Recherche...';
        if (subEl) subEl.textContent = st.statusText;

        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: PROFILES.map(p => p.service)
        });
        const server = await device.gatt.connect();

        let char = null;
        for (const profile of PROFILES) {
          try {
            const service = await server.getPrimaryService(profile.service);
            char = await service.getCharacteristic(profile.char);
            break;
          } catch (_) {}
        }

        if (!char) {
          server.disconnect();
          throw new Error('Appareil non compatible');
        }

        st.char = char;
        st.device = device;
        st.connected = true;
        st.statusText = device.name || 'Panneau connecté';
        renderUI();

        device.addEventListener('gattserverdisconnected', () => {
          st.char = null;
          st.connected = false;
          st.statusText = 'Déconnecté';
          renderUI();
        });
      } catch (err) {
        st.connected = false;
        st.statusText = err.message === 'Appareil non compatible' ? 'Non compatible' : 'Non connecté';
        renderUI();
      }
    }

    async function writeToPanel(id, bytes) {
      const st = bleState[id];
      if (!st || !st.char || st.writing) return;
      st.writing = true;
      try {
        const data = new Uint8Array(bytes);
        if (st.char.properties.writeWithoutResponse) {
          await st.char.writeValueWithoutResponse(data);
        } else {
          await st.char.writeValue(data);
        }
      } catch (e) {
        console.error(e);
      } finally {
        st.writing = false;
      }
    }

    function sendBytes(bytes) {
      if (target === 'all') {
        savedPanels.forEach(p => writeToPanel(p.id, bytes));
      } else {
        writeToPanel(target, bytes);
      }
    }

    // Palette rapide
    const presets = ['#FF0000', '#FF4500', '#FFD000', '#44FF00', '#0088FF', '#7722FF'];
    const swatchContainer = document.getElementById('swatches');
    presets.forEach(hex => {
      const el = document.createElement('div');
      el.className = 'swatch';
      el.style.background = hex;
      el.onclick = () => { stopAnim(); setHexColor(hex); };
      swatchContainer.appendChild(el);
    });

    document.getElementById('btnOn').onclick = () => { stopAnim(); sendBytes([0x01, 0x04, 0x02, 0x01]); };
    document.getElementById('btnOff').onclick = () => { stopAnim(); sendBytes([0x01, 0x04, 0x02, 0x00]); };

    function setHexColor(hex) {
      document.getElementById('colorPicker').value = hex;
      document.getElementById('hexLabel').textContent = hex.toUpperCase();
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      currentRGB = [r, g, b];
      sendBytes([0x01, 0x04, 0x0A, 0x01, r, g, b]);
    }

    document.getElementById('colorPicker').oninput = (e) => {
      stopAnim();
      setHexColor(e.target.value);
    };

    document.getElementById('brightness').oninput = (e) => {
      const val = parseInt(e.target.value, 10);
      document.getElementById('brightVal').textContent = val + '%';
      sendBytes([0x01, 0x04, 0x03, val]);
    };

    document.getElementById('cct').oninput = (e) => {
      stopAnim();
      const val = parseInt(e.target.value, 10);
      document.getElementById('cctVal').textContent = val + '%';
      const warm = Math.round((val * 255) / 100);
      const cool = 255 - warm;
      sendBytes([0x01, 0x04, 0x04, 0x00, warm, cool]);
    };

    function hslToRgb(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
    }

    function stopAnim() {
      if (animTimer) clearInterval(animTimer);
      animTimer = null;
      currentAnim = null;
      document.getElementById('animLabel').textContent = 'Off';
      document.querySelectorAll('[data-anim]').forEach(b => b.classList.remove('selected'));
    }

    function startAnim(type) {
      if (currentAnim === type) { stopAnim(); return; }
      stopAnim();
      currentAnim = type;
      document.querySelector(`[data-anim="${type}"]`).classList.add('selected');
      document.getElementById('animLabel').textContent = type;

      let step = 0;
      const delay = 580 - parseInt(document.getElementById('speed').value, 10);

      animTimer = setInterval(() => {
        if (type === 'rainbow') {
          step = (step + 6) % 360;
          const [r, g, b] = hslToRgb(step, 100, 50);
          sendBytes([0x01, 0x04, 0x0A, 0x01, r, g, b]);
        } else if (type === 'pulse') {
          step = (step + 0.12) % (Math.PI * 2);
          const factor = (Math.sin(step) + 1) / 2;
          const [r, g, b] = currentRGB.map(c => Math.round(c * factor));
          sendBytes([0x01, 0x04, 0x0A, 0x01, r, g, b]);
        } else if (type === 'police') {
          step = (step + 1) % 4;
          const colors = [[255, 0, 0], [0, 0, 0], [0, 40, 255], [0, 0, 0]];
          const [r, g, b] = colors[step];
          sendBytes([0x01, 0x04, 0x0A, 0x01, r, g, b]);
        }
      }, delay);
    }

    document.querySelectorAll('[data-anim]').forEach(btn => {
      btn.onclick = () => startAnim(btn.dataset.anim);
    });

    document.getElementById('speed').oninput = () => {
      if (currentAnim) {
        const active = currentAnim;
        stopAnim();
        startAnim(active);
      }
    };

    const MODAL_KEY = 'zf319_modal_seen_v2';
        const modalPages = [
          {
            title: 'Identifier votre panneau LED',
            text: 'Lors de la connexion Bluetooth, votre navigateur affichera tous les appareils à proximité. Le nom de votre projecteur ZOESURE ressemble généralement à : « ZF319-4B56 », « ZF-XXXX » ou « ZT-XXXX ».'
          },
          {
            title: 'Reconnexion après actualisation',
            text: 'Pour des raisons de sécurité imposées par les navigateurs web, la connexion Bluetooth est coupée à chaque rechargement de la page. Il faut donc cliquer sur « Connecter » pour resélectionner vos panneaux LED à chaque actualisation.'
          },
          {
            title: 'Fonctionnement des animations',
            text: 'Les animations (Arc-en-ciel, Respiration, Gyrophare) sont calculées en direct par cette page. Votre téléphone doit donc rester à proximité et connecté en Bluetooth aux panneaux LED pour que l’animation continue de tourner.'
          },
          {
            title: 'À propos & Licence',
            text: 'Je m’appelle Alex et je mets ce site web gratuitement à disposition pour aider les utilisateurs dont l’application officielle a fermé. Ce projet est libre d’utilisation personnelle, mais il est strictement interdit de se l’approprier ou de le revendre.'
          }
        ];
    
        let currentModalPage = 0;
        const modalEl = document.getElementById('infoModal');
    
        function updateModal() {
          const page = modalPages[currentModalPage];
          document.getElementById('modalStep').textContent = `Information ${currentModalPage + 1} / ${modalPages.length}`;
          document.getElementById('modalTitle').textContent = page.title;
          document.getElementById('modalBody').textContent = page.text;
    
          modalPages.forEach((_, i) => {
            document.getElementById(`dot${i}`).classList.toggle('active', i === currentModalPage);
          });
    
          document.getElementById('modalPrev').style.display = currentModalPage > 0 ? 'inline-block' : 'none';
          document.getElementById('modalNext').textContent = currentModalPage === modalPages.length - 1 ? 'Compris' : 'Suivant';
        }
  </script>
</body>
</html>
